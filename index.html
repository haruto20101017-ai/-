<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Supabaseチャット</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body { margin:0; font-family:sans-serif; background:#cdebf9; }
.container { max-width:500px; margin:auto; height:100vh; display:flex; flex-direction:column; }
.chat { flex:1; overflow-y:auto; padding:10px; }
.msg { margin:5px; }
.me { text-align:right; }
.bubble { display:inline-block; padding:10px; border-radius:10px; max-width:70%; }
.me .bubble { background:#00c300; color:white; }
.other .bubble { background:white; }
</style>
</head>

<body>

<div class="container">
<div id="online"></div>
<div id="chat" class="chat"></div>

<input id="name" placeholder="名前">
<input type="file" id="file">
<textarea id="msg"></textarea>
<button onclick="send()">送信</button>

<div>
<img src="https://i.imgur.com/abc1.png" onclick="sendStamp(this.src)" width="50">
</div>
</div>

<script>

// ★ここに自分のSupabase情報
const supabase = window.supabase.createClient(
  "https://xiotksilwbtlohnzpyeu.supabase.co",
  "sb_publishable_csKKoGAtTFnh0MjAxrD_qQ_9YeWP96Y"
);

// ユーザーID
let uid = localStorage.getItem("uid");
if (!uid) {
  uid = "user_" + Math.random();
  localStorage.setItem("uid", uid);
}

// 送信
async function send() {
  const name = document.getElementById("name").value || "名無し";
  const msg = document.getElementById("msg").value;
  const file = document.getElementById("file").files[0];

  let imageUrl = "";

  if (file) {
    const path = Date.now() + "_" + file.name;

    await supabase.storage.from("images").upload(path, file);
    const { data } = supabase.storage.from("images").getPublicUrl(path);

    imageUrl = data.publicUrl;
  }

  await supabase.from("posts").insert({
    name,
    message: msg,
    uid,
    image: imageUrl,
    readby: [uid],
    time: Date.now()
  });

  document.getElementById("msg").value = "";
}

// スタンプ
async function sendStamp(src) {
  await supabase.from("posts").insert({
    name: "スタンプ",
    uid,
    stamp: src,
    readby: [uid],
    time: Date.now()
  });
}

// 表示（リアルタイム）
supabase.channel("room")
.on(
  "postgres_changes",
  { event: "*", schema: "public", table: "posts" },
  load
)
.subscribe();

async function load() {
  const { data } = await supabase
    .from("posts")
    .select("*")
    .order("time");

  const chat = document.getElementById("chat");
  chat.innerHTML = "";

  data.forEach(async p => {

    if (!p.readby.includes(uid)) {
      p.readby.push(uid);
      await supabase.from("posts")
        .update({ readby: p.readby })
        .eq("id", p.id);
    }

    const div = document.createElement("div");
    div.className = p.uid === uid ? "msg me" : "msg other";

    const readCount = p.readby.length - 1;

    div.innerHTML = `
      <div class="bubble">
        ${p.message || ""}
        ${p.image ? `<img src="${p.image}" width="150">` : ""}
        ${p.stamp ? `<img src="${p.stamp}" width="100">` : ""}
      </div>
      <div>${readCount > 0 ? "既読" + readCount : ""}</div>
    `;

    chat.appendChild(div);
  });

  chat.scrollTop = chat.scrollHeight;
}

load();

// オンライン
setInterval(async () => {
  await supabase.from("online").upsert({
    uid,
    name: "オンライン",
    lastseen: Date.now()
  });
}, 5000);

</script>
</body>
</html>
